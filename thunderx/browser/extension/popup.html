<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #00d4ff;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00d4ff;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .task {
      background: #16213e;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 5px;
    }
    .task-name {
      font-size: 12px;
      color: #00d4ff;
      margin-bottom: 5px;
      word-break: break-all;
    }
    .task-progress {
      background: #0f3460;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }
    .task-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      transition: width 0.3s;
    }
    .task-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-top: 5px;
    }
    .btn {
      background: #0f3460;
      color: #00d4ff;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn:hover {
      background: #1a4a8a;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ThunderX</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div id="tasks">
    <div class="empty">No active downloads</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
